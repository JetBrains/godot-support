[plugin]

name="JetBrains Rider External Editor"
description="Godot 4.6+ editor plugin. Simplifies setting up Rider as External Editor. Initializes the Godot ↔ Rider bridge (godot-rd) with the selected Rider install. Provides a toolbar menu, to switch a settings preset. The preset helps to enable/disable the following settings recommended by the Rider documentation https://www.jetbrains.com/help/rider/Godot.html#optimize-godot-editor-for-rider"
author="JetBrains"
version="v1.0.0"
script="rider-plugin.gd"

[presets]

active="off"
presets="presets.json"
